name: Build iOS Tweak

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up Theos Environment
      run: |
        git clone --recursive https://github.com ~/theos
        echo "THEOS=~/theos" >> $GITHUB_ENV
        
    - name: Download iOS SDK
      run: |
        git clone https://github.com ~/theos/sdks

    - name: Compile Code
      run: |
        cd $GITHUB_WORKSPACE
        make package FINALPACKAGE=1
        
    - name: Upload Compiled File
      uses: actions/upload-artifact@v4
      with:
        name: Compiled-iOS-Menu
        path: .theos/obj/debug/*.dylib
